[package]
name = "kwsearch"
version = "0.1.0"
edition = "2021"
publish = false

# POC (branch poc/kwsearch, never merged as is): the Tantivy keyword service
# from the search storage roadmap (R3). Reads `keyword_feed` (commit-safe by
# xid8), keeps 256 Tantivy shards by hash(user), answers POST /search.
# Never sees note text or HMAC keys: rows carry hashed term ids (kwfeed codec).
[dependencies]
kwfeed = { path = "../kwfeed" }
tantivy = { version = "0.27", default-features = false, features = ["mmap"] }
postgres = { version = "0.19", features = ["with-uuid-1"] }
uuid = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Bench and test tooling only (subcommands of the same binary).
ureq = "2"
rand = "0.9"
