# One workspace, one lockfile, one toolchain (rust-toolchain.toml here):
# engram_core is the pure-Rust engine shared with the wasm clients;
# engram_native is the NIF that wraps it; wasm_guard is CI-only (the wasm32
# import check). Rustler builds engram_native as a member; its artifact lands
# in native/target.
[workspace]
members = ["engram_core", "engram_native", "wasm_guard"]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1
