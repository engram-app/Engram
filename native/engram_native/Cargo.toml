[package]
name = "engram_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "engram_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
rustler = "0.37"
hmac = "0.12"
sha2 = "0.11"
unicode-normalization = "0.1"
unicode-segmentation = "1"
regex = "1"
snowball_stemmers_rs = "1.0.1"
pulldown-cmark = { version = "0.13", default-features = false }
ryu = "1"
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
codegen-units = 1
