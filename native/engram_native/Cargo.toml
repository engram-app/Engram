[package]
name = "engram_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "engram_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
rustler = "0.38"
ring = "0.17"
zstd = "0.13"
getrandom = "0.2"
hmac = "0.13"
sha2 = "0.11"
unicode-normalization = "0.1"
unicode-segmentation = "1"
regex = "1"
snowball_stemmers_rs = "1.0.1"
pulldown-cmark = { version = "0.13", default-features = false }
ryu = "1"
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
# Same version and parse options as mdex_native 0.2.9 (the parser Sections
# used before md_outline), so section boundaries did not move in the port.
comrak = { version = "=0.55.0", default-features = false }

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
# Only for the ignored AES-GCM microbench (envelope.rs), ring's baseline.
aes-gcm = "0.10"
