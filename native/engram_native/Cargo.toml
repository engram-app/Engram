[package]
name = "engram_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "engram_native"
crate-type = ["cdylib", "rlib"]

# `test-hooks`: NIFs only the ExUnit suite may call (the fixed-nonce seal).
# config/dev.exs and config/test.exs turn it on through Rustler; prod.exs
# does not, so the release image's .so does not export them.
[features]
test-hooks = []

[dependencies]
rustler = "0.38"
# The envelope engine (pure Rust, shared with the wasm clients).
engram_core = { path = "../engram_core" }
getrandom = "0.4"
hmac = "0.13"
sha2 = "0.11"
unicode-normalization = "0.1"
unicode-segmentation = "1"
regex = "1"
snowball_stemmers_rs = "1.0.1"
pulldown-cmark = { version = "0.13", default-features = false }
ryu = "1"
# Fuzzy name search for the vault name index (names.rs); helix's matcher.
nucleo-matcher = "0.3"
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
# Same version and parse options as mdex_native 0.2.9 (the parser Sections
# used before md_outline), so section boundaries did not move in the port.
comrak = { version = "=0.55.0", default-features = false }
