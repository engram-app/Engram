# Minified self-host stack for CI (#297) — proves STORAGE_BACKEND=database
# boots and round-trips attachment bytes through Postgres with NO MinIO.
#
# Only engram + postgres: AUTH_PROVIDER defaults to "local" (no Clerk child),
# and the supervision tree starts no Qdrant/Ollama client, so this is the
# smallest stack the release can boot in. The `storage-database` CI job runs
#   bin/engram rpc <put/get/delete round-trip>
# against this stack to exercise the bytea adapter end-to-end.
#
#   ENGRAM_CI_IMAGE=<tag> docker compose -f ci/compose.database.yml \
#     -p engram-ci-db up -d --no-build --wait

name: engram-ci-db

services:
  engram:
    image: ${ENGRAM_CI_IMAGE:-engram-ci:local}
    build:
      context: ..
      args:
        # Bare image refs; runner's HTTPS_PROXY config caches via FastRaid
        # transparently (see docs/context/runner-vm-setup.md Gotcha #6).
        # No BUILDER_IMAGE here: the Dockerfile default is the single source,
        # and it feeds the engram-deps hash (CI builds the deps stage directly).
        RUNNER_IMAGE: debian:bookworm-20241202-slim
    ports:
      - "${CI_ENGRAM_PORT:-8110}:4000"
    environment:
      SECRET_KEY_BASE: "ci-test-secret-base-not-for-production-at-least-64-bytes-long-enough-for-phoenix"
      DATABASE_URL: postgresql://engram:engram@postgres:5432/engram
      JWT_SECRET: ci-test-secret-not-for-production
      # Prod build: keep CI out of the self-host install census.
      ENGRAM_TELEMETRY: "false"
      PHX_SERVER: "true"
      KEY_PROVIDER: ${KEY_PROVIDER:-local}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY must be set (CI workflow injects from secret)}
      # The whole point of this stack: bytea storage, no MinIO sidecar.
      STORAGE_BACKEND: database
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/api/health || exit 1"]
      start_period: 10s
      interval: 1s
      timeout: 2s
      retries: 60
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:18.4
    # Throwaway data dir in RAM, as the unit-tests job does. On the gamingpc
    # VMs a shared-disk sync stalled initdb 23 s plus a 6 s shutdown
    # checkpoint, past the 30 s health budget (run 39373741040).
    tmpfs:
      - /var/lib/postgresql
    ports:
      - "${CI_PG_PORT:-5443}:5432"
    environment:
      POSTGRES_USER: engram
      POSTGRES_PASSWORD: engram
      POSTGRES_DB: engram
    healthcheck:
      # Over TCP: the image's first-boot init runs a temporary server on the
      # Unix socket only, then restarts. A socket check passes against that
      # temporary server, and the app's migrate hits the restart gap.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U engram"]
      interval: 1s
      timeout: 2s
      retries: 30
    restart: "no"
