# Ephemeral CI test stack — Ollama on FastRaid (GPU), Qdrant on SlowRaid (AVX2).
#
# Always invoke with explicit project name for stable container names:
#   docker compose -f ci/compose.yml -p engram-ci up -d --build --wait
#   python3 -m pytest e2e/tests/ -v  # E2E tests run against this stack
#   docker compose -f ci/compose.yml -p engram-ci down -v --remove-orphans
#
# Container names: engram-ci-engram-1, engram-ci-postgres-1.
#
# External services (persistent, not in this compose):
#   Ollama:  http://10.0.20.214:11434  (FastRaid — GPU for embeddings)
#   Qdrant:  http://10.0.20.201:6333   (SlowRaid — AVX2 for binary quantization, v1.17.1)
#
# Ports default to offsets from standard dev ports, but can be overridden
# via CI_ENGRAM_PORT / CI_PG_PORT for parallel-safe runs.

name: engram-ci

services:
  engram:
    # Registry-qualified tag published by the CI `prebuild-ci-image` job
    # (`${LOCAL_REGISTRY}/engram-ci:<hash>` on FastRaid :5001). The e2e jobs
    # `docker pull` it before `up --no-build`, so it works regardless of which
    # runner host they land on — the pool is multi-daemon, not shared. Local
    # dev falls back to `engram-ci:local` (built by `docker compose build`).
    image: ${ENGRAM_CI_IMAGE:-engram-ci:local}
    build:
      context: ..
      args:
        # Bare image refs; the runner's HTTPS_PROXY config caches via FastRaid
        # (rpardini docker-registry-proxy at 10.0.20.214:5000) transparently —
        # see docs/context/runner-vm-setup.md Gotcha #6. Prefixing with
        # ${LOCAL_REGISTRY} treats the proxy as a registry mirror, which it is
        # not, and BuildKit fails with "unexpected media type / not found".
        NODE_IMAGE: node:20-slim
        BUILDER_IMAGE: hexpm/elixir:1.17.3-erlang-27.3.4.14-debian-bookworm-20260623-slim
        RUNNER_IMAGE: debian:bookworm-20241202-slim
        # LAN Hex pull-through (set by CI env; empty for local dev = upstream).
        HEX_MIRROR: ${HEX_MIRROR:-}
    ports:
      - "${CI_ENGRAM_PORT:-8100}:4000"
    environment:
      SECRET_KEY_BASE: "ci-test-secret-base-not-for-production-at-least-64-bytes-long-enough-for-phoenix"
      DATABASE_URL: postgresql://engram:engram@postgres:5432/engram
      JWT_SECRET: ci-test-secret-not-for-production
      PHX_SERVER: "true"
      # Tell the stack the URL it is actually reachable at. The container
      # listens on 4000 but is published on CI_ENGRAM_PORT, and without these
      # `EngramWeb.Endpoint.url()` falls back to config.exs's bare
      # `http://localhost` — so every URL the server derives about ITSELF
      # (OAuth discovery `resource`, the RFC 9728 metadata pointer, device-flow
      # links) named a host nobody could reach.
      #
      # That is why this stack could never catch a URL-derivation bug — the
      # class #634 and both 2026-08-05 discovery bugs live in. A server that
      # misstates its own address cannot be tested for stating it correctly.
      #
      # Setting PHX_HOST also switches CORS/WS from permissive to the
      # allowlist (runtime.exs). Safe here: Engram.HostOrigins always appends
      # `app://obsidian.md`, `capacitor://localhost` and `http://localhost`,
      # which covers the plugin, and the Python API clients send no Origin.
      PHX_HOST: localhost
      PHX_PORT: "${CI_ENGRAM_PORT:-8100}"
      PHX_SCHEME: http
      # REQUIRED alongside PHX_HOST, not optional decoration.
      #
      # Setting PHX_HOST also switches `:websocket_check_origin` on
      # (runtime.exs — it lives inside `if phx_hosts do`). `HostOrigins` then
      # allowlists `http://localhost` WITHOUT a port, but the web SPA is served
      # by Phoenix on CI_ENGRAM_PORT and opens its socket with
      # `Origin: http://localhost:<port>`. That does not match, the socket is
      # refused, and every web<->Obsidian CRDT live-sync test times out while
      # the Obsidian-only tiers stay green (they send `app://obsidian.md`,
      # which IS allowlisted).
      #
      # Observed exactly that on #1260: e2e-clerk green, e2e-crdt's four
      # live-sync tests red. Prod is unaffected — `app.engram.page` is :443, so
      # its Origin carries no port — which is precisely why it needed CI to
      # surface it.
      ENGRAM_SAAS_FRONTEND_ORIGINS: "http://localhost:${CI_ENGRAM_PORT:-8100}"
      OLLAMA_URL: http://10.0.20.214:11434
      QDRANT_URL: http://10.0.20.201:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-ci_test_notes}
      EMBED_MODEL: mxbai-embed-large
      EMBED_DIMS: "1024"
      EMBED_BACKEND: ollama
      AUTH_PROVIDER: clerk
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      KEY_PROVIDER: ${KEY_PROVIDER:-local}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY must be set (CI workflow injects from secret, local dev sets via .env)}
      ENCRYPTION_MASTER_KEY_PREVIOUS: ${ENCRYPTION_MASTER_KEY_PREVIOUS:-}
      # S3-compatible attachment storage. This stack tests the S3 path, so
      # STORAGE_BACKEND is pinned to s3 — the e2e ciphertext-at-rest probe
      # expects a real object. (The bytea `database` backend, #297, is
      # exercised separately by the storage-database CI job; runtime.exs
      # defaults to s3.)
      #
      # POINTS AT THE CENTRAL FASTRAID MINIO, not a per-stack sidecar.
      #
      # The sidecar was a 400MB image + volume per concurrent stack, on runner
      # VMs that ran out of disk twice on 2026-08-05.
      #
      # ONE PERMANENT BUCKET, SHARED BY EVERY RUN. Not per-run — deliberately.
      #
      # The per-run design (#1267) had to CREATE a bucket per job and remember
      # to delete it, across two best-effort teardown paths. Anything that must
      # be remembered gets forgotten: a cancelled job or a dead runner leaked
      # the bucket forever, which is precisely how Qdrant's per-run collections
      # reached 297 orphans and crash-looped it into a CI-wide outage. Fixing
      # that with another reaper would just add a third thing to forget.
      #
      # Runs do not collide, because the BUCKET was never what isolated them —
      # object keys are `<user_id>/<vault_id>/objects/<uuid>` and every run
      # mints fresh users, so keys are already globally unique. The per-run
      # bucket bought isolation the key space provides for free.
      #
      # Expiry is a server-side MinIO ILM rule on the bucket (7 days), so
      # nothing in CI deletes anything: no sidecar, no teardown, no cron. This
      # is exactly how `gha-cache` works, and it is the one shared-host
      # resource in this system that has never leaked.
      #
      # Because nothing here deletes, there is no longer any path by which a
      # misconfigured bucket name could reach staging's live
      # `engram-saas-attachments`. That hazard is gone structurally rather than
      # guarded against.
      STORAGE_BACKEND: s3
      STORAGE_BUCKET: ${CI_MINIO_BUCKET:-ci-e2e}
      STORAGE_ACCESS_KEY_ID: ${CI_MINIO_ACCESS_KEY:?CI_MINIO_ACCESS_KEY must be set (CI injects from secret; local dev sets it in .env)}
      STORAGE_SECRET_ACCESS_KEY: ${CI_MINIO_SECRET_KEY:?CI_MINIO_SECRET_KEY must be set (CI injects from secret; local dev sets it in .env)}
      STORAGE_SCHEME: "http://"
      STORAGE_HOST: ${CI_MINIO_HOST:-10.0.20.214}
      STORAGE_PORT: "${CI_MINIO_PORT:-9101}"
      STORAGE_REGION: us-east-1
      # Force plan-limit enforcement in CI. Without this, runtime.exs's
      # self-host bypass (PADDLE_API_KEY unset → :limits_enforced=false)
      # would kick in and free-tier limits (e.g. vaults_cap=1) would not
      # be enforced — breaking e2e tests like test_32 that assert 402 on
      # over-limit vault creation.
      ENGRAM_LIMITS_ENFORCED: "true"
      # OAuth e2e tests (test_44/47/48/49) collectively call
      # POST /api/auth/device + /auth/device/authorize + /auth/token/refresh
      # well above the prod default 10 req/60s/IP from the test runner's
      # single source IP — collisions yield flaky 429 "rate_limited" failures.
      # Mirrors the override in ci/compose.local.yml.
      # CI=true gates the override on (runtime.exs / Engram.RuntimeConfig): the
      # backend only honors RATE_LIMIT_AUTH_OVERRIDE when CI=true, so a stray
      # copy of this var can never weaken the limiter in prod. Inherited by the
      # ci-local overlay. (The Playwright e2e job runs in the GitHub runner,
      # which sets CI=true automatically.)
      CI: "true"
      RATE_LIMIT_AUTH_OVERRIDE: "1000"
      # PreAuthRateLimit (the 401-loop defense in front of /api/notes etc.)
      # defaults to 600 req/60s per bucket — bulk/rapid E2E writes (test_77
      # bulk-sync ~1000 notes, test_78 hash-update) burst past it → flaky 429s.
      # Same CI=true gating as the auth override (runtime.exs).
      PRE_AUTH_RATE_LIMIT_OVERRIDE: "100000"
      # CrdtChannel per-message (@msg_limit 240/10s) + handshake (@hs_limit 2400)
      # budgets are sized for a real single user. The compressed e2e workload
      # (rapid edits + resumed-device room rejoins across the suite) exceeds them
      # and fires channel-join/per-message "rate_limited", stalling delivery.
      # Same CI=true gating (runtime.exs) keeps prod limits un-weakenable.
      CRDT_MSG_RATE_LIMIT_OVERRIDE: "100000"
      CRDT_HS_RATE_LIMIT_OVERRIDE: "100000"
      # Room drain (#1152) turned ON for e2e only, under the same CI=true gate.
      # In production NOTHING sets idle_exit_ms, so the drain never fires and is
      # therefore never exercised against a real client — every unit and channel
      # test stands a test process in for the plugin. Enabling it here means the
      # whole Obsidian suite runs with rooms being released out from under the
      # client mid-session, which is the only way to prove the property the
      # design rests on: the client re-spins on its next frame and loses nothing.
      #
      # 5s is short enough that rooms genuinely drain between test steps and long
      # enough that it is not pathological. If this destabilises the suite, that
      # is a REAL finding about the drain, not CI noise — raise it deliberately
      # rather than deleting the line.
      CRDT_IDLE_EXIT_MS: ${CRDT_IDLE_EXIT_MS:-5000}
      # Free-tier launch test_72_cancel_to_free_overlimit signs a synthetic
      # subscription.canceled webhook with this fixed secret so the e2e
      # exercises the real verify_signature → upsert_from_paddle_event path
      # (Phase 4) end-to-end. Not a real Paddle env — purely test fixture.
      PADDLE_NOTIFICATION_SECRET: ${PADDLE_NOTIFICATION_SECRET:-pdl_ntfn_e2e_fake}
    healthcheck:
      # 1s interval (was 3s) so docker compose --wait detects "ready" with
      # finer granularity — BEAM cold boot finishes mid-interval and the
      # next probe fires within 1s instead of waiting up to 3s.
      # start_period 10s covers release migrate + Phoenix endpoint listen.
      # Retry budget: 10s start_period + 60*1s = 70s before docker marks
      # container failed (was 3s + 15*3s = 48s) — slightly more lenient but
      # ready-detection is much tighter on the happy path.
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/api/health || exit 1"]
      start_period: 10s
      interval: 1s
      timeout: 2s
      retries: 60
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:18.4
    ports:
      - "${CI_PG_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: engram
      POSTGRES_PASSWORD: engram
      POSTGRES_DB: engram
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engram"]
      interval: 1s
      timeout: 2s
      retries: 30
    restart: "no"

