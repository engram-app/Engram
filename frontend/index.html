<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Engram</title>
    <!-- The splash below, styled before any stylesheet arrives. Without this it
         painted unstyled ("Loading…" top-left, UA body margin) until CSS landed:
         always in dev, where Vite injects CSS from JS, and on any slow
         stylesheet in prod. Values are main.css's --background,
         --muted-foreground, --border and --primary, so the handoff to the
         Tailwind-styled splash is seamless; src/splash-tokens.test.ts keeps them in sync. -->
    <style>
      /* A layer declared before Tailwind's: lowest precedence, so the real
         styles win the moment they load. */
      @layer splash {
        html { background: oklch(100% 0 0); }
        html.dark { background: oklch(18.76% 0.004 286.01); }
        body { margin: 0; }
        #root > main[role="status"] {
          display: flex; height: 100vh; flex-direction: column; align-items: center;
          justify-content: center; gap: 0.75rem; font: 0.875rem/1.25rem system-ui, sans-serif;
          color: oklch(44.19% 0.0146 285.79);
        }
        html.dark #root > main[role="status"] { color: oklch(82.64% 0.0186 201.07); }
        #root > main[role="status"] p { margin: 0; }
        #root > main[role="status"] > span {
          width: 1.5rem; height: 1.5rem; box-sizing: border-box; border-radius: 9999px;
          border: 2px solid oklch(91.97% 0.004 286.32); border-top-color: oklch(60.89% 0.1109 221.72);
          animation: engram-splash-spin 1s linear infinite;
        }
        html.dark #root > main[role="status"] > span {
          border-color: oklch(39.39% 0.0182 207.04); border-top-color: oklch(87% 0.1481 202.88);
        }
        @keyframes engram-splash-spin { to { transform: rotate(360deg); } }
      }
    </style>
    <script>"use strict";
      (() => {
        try {
          const stored = window.localStorage.getItem('engram:theme');
          const valid = stored === 'light' || stored === 'dark' || stored === 'system';
          const choice = valid ? stored : 'system';
          const prefersDark =
            window.matchMedia?.('(prefers-color-scheme: dark)').matches;
          const resolved = choice === 'system' ? (prefersDark ? 'dark' : 'light') : choice;
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch {
          /* fall back to default (light) */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static splash: paints as soon as the (render-blocking) stylesheet
           lands, long before the JS bundle parses and React mounts. React's
           createRoot().render() replaces it with the app. Markup + classes
           mirror src/layout/loading-screen.tsx so the splash → LoadingScreen
           handoff is pixel-identical (keep the two in sync). -->
      <main
        role="status"
        aria-label="Loading"
        class="flex h-screen flex-col items-center justify-center gap-3 bg-background text-foreground"
      >
        <span
          aria-hidden="true"
          class="size-6 animate-spin rounded-full border-2 border-border border-t-primary"
        ></span>
        <p class="text-muted-foreground text-sm">Loading…</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
