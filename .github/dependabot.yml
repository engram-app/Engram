# Dependabot — managed by engram-infra/main/github/dependabot_config.tf.
# DO NOT EDIT IN-REPO; changes will be overwritten on next tf apply.
version: 2
updates:
  # Elixir backend deps.
  - package-ecosystem: mix
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      mix-minor:
        applies-to: version-updates
        update-types: [patch, minor]
      mix-dev-minor:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]

  # React/Vite frontend (bun.lock — bun ecosystem, not npm).
  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      frontend-minor:
        applies-to: version-updates
        update-types: [patch, minor]

  # In-house Rust (native/engram_native, and native/engram_core, the
  # engine it shares with the wasm clients; one entry so a grouped bump
  # moves both lockfiles together). On 0.x crates a
  # "minor" bump (pulldown-cmark 0.13 -> 0.14) is semver-breaking, so
  # a grouped (auto-merged) PR can change parsing. verify.yml runs
  # `cargo test` plus the Elixir golden sets on it before merge.
  - package-ecosystem: cargo
    directories:
      - /native/engram_native
      - /native/engram_core
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      cargo-minor:
        applies-to: version-updates
        update-types: [patch, minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
    open-pull-requests-limit: 10
    groups:
      gha-all:
        applies-to: version-updates
        update-types: [patch, minor]
