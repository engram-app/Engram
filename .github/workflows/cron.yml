name: cron

# Consolidated scheduled jobs + manual diagnostics. Replaces six
# standalone workflow files (clerk-orphans, runner-cleanup, obsidian-update,
# plan-triage, frontend-major-updates, runner-diagnostics).
#
# Each schedule firing still appears as its OWN run in the Actions UI —
# this is file-count cleanup (6 files → 1), not UI-count cleanup. The win
# is having all cron job bodies under one path so cross-cutting changes
# (runner labels, common deps, the isolated-runner concurrency idiom)
# touch one file.
#
# Each job's `if:` matches either its schedule (`github.event.schedule`)
# OR the dispatch input (`inputs.task`). Scheduled firings only run the
# matching job; the rest `if:`-out. Manual dispatch via:
#   gh workflow run cron.yml -f task=<name>            (most tasks)
#   gh workflow run cron.yml -f task=obsidian-update -f force=true

on:
  schedule:
    - cron: '30 * * * *'    # e2e-orphans (clerk + qdrant)  (hourly, :30)
    - cron: '0 3 * * 0'     # runner-cleanup           (Sun 03:00 UTC)
    - cron: '0 4 * * 1'     # obsidian-update          (Mon 04:00 UTC)
    - cron: '17 13 * * 1'   # frontend-major-updates   (Mon 13:17 UTC)
    - cron: '0 14 * * 1'    # plan-triage              (Mon 14:00 UTC)
    - cron: '0 3 * * 6'     # dependency-submission    (Sat 03:00 UTC)
    - cron: '40 5 * * *'    # mcp-conformance          (daily 05:40 UTC)
  workflow_dispatch:
    inputs:
      task:
        description: 'Which task to run'
        type: choice
        required: true
        options:
          - e2e-orphans
          - runner-cleanup
          - obsidian-update
          - plan-triage
          - frontend-major-updates
          - runner-diagnostics
          - dependency-submission
          - mcp-conformance
      force:
        description: '(obsidian-update only) Force re-download even if version matches'
        type: boolean
        default: false
      target-url:
        description: '(mcp-conformance only) MCP endpoint to test'
        type: string
        default: 'https://staging.engram.page/api/mcp'

# No workflow-level permissions — each job grants what it actually needs.
permissions: {}

jobs:
  # ── Out-of-band cleanup for orphaned e2e resources left behind by crashed CI
  # runs: stale e2e-* Clerk users AND leaked CI Qdrant collections. Both leak
  # the same way — a run cancelled / OOM-killed before its teardown fired never
  # cleans up. Bundled into ONE hourly job (was two would-be schedules).
  # Hourly (:30): the Clerk dev instance caps at 100 users, and a heavy-CI
  # burst (release day, an e2e-rerun storm) can mint 100+ e2e-* users within
  # a few hours — faster than a once-daily sweep clears them, exhausting the
  # quota and 403'ing every Clerk-auth e2e run (2026-06-13). Hourly bounds the
  # standing orphan count to ~1-2h of churn; the 1h age filter still protects
  # in-flight runs. (Was once-daily 2026-06-02..06-13 — too sparse for bursts.)
  # The Qdrant reap rides this same job but self-gates to once a day (see its
  # step) — no separate schedule — and is protected against live runs by an
  # active-run guard instead of a time filter.
  e2e-orphans:
    if: |
      github.event.schedule == '30 * * * *'
      || github.event.inputs.task == 'e2e-orphans'
    runs-on: [self-hosted, linux, x64, isolated]
    permissions:
      contents: read
      actions: read   # qdrant reaper lists active workflow runs to protect them
    concurrency:
      group: e2e-orphans
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # cleanup_clerk_users imports `helpers.clerk_constants` (the shared
          # e2e-email predicate, #558), so the helpers package must be checked
          # out too — omitting it crashed the reaper with ModuleNotFoundError,
          # leaving the quota to fill (#558). The qdrant script is self-contained.
          sparse-checkout: |
            e2e/scripts/cleanup_clerk_users.py
            e2e/scripts/cleanup_qdrant_collections.py
            e2e/helpers/__init__.py
            e2e/helpers/clerk_constants.py

      - name: Ensure requests is available
        # --break-system-packages: isolated runner VM runs Python 3.12
        # with PEP 668 (externally-managed-environment); pip --user
        # fails closed without it. Safe — VM is single-purpose CI.
        run: python3 -m pip install --user --quiet --break-system-packages "requests>=2.31"

      - name: Reap orphan e2e Clerk users older than 1h
        env:
          E2E_CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
        run: |
          if [ -z "${E2E_CLERK_SECRET_KEY}" ]; then
            echo "E2E_CLERK_SECRET_KEY not set — skipping." >&2
            exit 0
          fi
          python3 e2e/scripts/cleanup_clerk_users.py --older-than 1h

      # Reaps orphaned CI Qdrant collections on the shared SlowRaid Qdrant. Each
      # e2e job creates a per-run collection (ci_test_<run>_obsidian /
      # ci_crdt_<run>) and deletes it on teardown, but that DELETE is best-effort
      # (`curl ... || true`) — a cancelled job or an unreachable Qdrant leaks it.
      # They reached 297 orphans by 2026-07-19, at which point Qdrant ENOMEM-
      # panicked loading every shard on boot → crash loop → CI-wide "Qdrant not
      # reachable" outage. Reaps every ci_* collection whose run is no longer
      # active; real vaults never match the ci_ prefix.
      #
      # Unlike the Clerk sweep (hourly — 100-user cap), Qdrant collections
      # accumulate slowly (crash threshold ~300, dozens/day), so this reaps ONCE
      # A DAY. It rides the hourly job but self-gates to the 03:xx firing rather
      # than adding a second schedule. Manual dispatch always runs it.
      - name: Reap orphaned CI Qdrant collections (daily)
        env:
          QDRANT_URL: http://10.0.20.201:6333
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(date -u +%H)" != "03" ]; then
            echo "Skipping Qdrant reap — runs daily ~03:30 UTC (current hour: $(date -u +%H) UTC)."
            exit 0
          fi
          python3 e2e/scripts/cleanup_qdrant_collections.py

  # ── Weekly Docker + /tmp prune on the self-hosted runner. Keeps disk
  # usage bounded so long-running runner VMs don't fill up.
  runner-cleanup:
    if: |
      github.event.schedule == '0 3 * * 0'
      || github.event.inputs.task == 'runner-cleanup'
    runs-on: [self-hosted, linux, x64, isolated]
    permissions:
      contents: read
    steps:
      - name: Docker cleanup
        run: |
          echo "=== Before ==="
          docker system df

          # 1. Remove stopped containers + their volumes
          docker container prune -f 2>/dev/null || true

          # 2. Remove dangling volumes (anonymous volumes from dead containers)
          docker volume prune -f 2>/dev/null || true

          # 3. Remove dangling images (untagged layers)
          docker image prune -f 2>/dev/null || true

          # 4. Keep only latest 3 GHCR engram release tags
          docker images --format '{{.Repository}}:{{.Tag}}' \
            --filter "reference=ghcr.io/engram-app/engram:*" \
            | grep -v ':latest$' \
            | tail -n +3 \
            | xargs -r docker rmi 2>/dev/null || true

          # 5. Keep only latest CI cache image
          docker images --format '{{.Repository}}:{{.Tag}}' \
            --filter "reference=engram-ci:*" \
            | tail -n +2 \
            | xargs -r docker rmi 2>/dev/null || true

          # 6. Remove stale per-run images that slipped through teardown (cancelled jobs)
          docker images --format '{{.Repository}}:{{.Tag}}' \
            --filter "reference=engram-ci-*-engram:latest" \
            | xargs -r docker rmi 2>/dev/null || true

          # 7. Prune build cache — keep max 2GB, nuke the rest
          # --mount=type=cache entries stay "active" indefinitely, so age-based
          # filters don't work. Use --all to reclaim everything, then rebuild
          # cache naturally on next CI run.
          docker builder prune --all --keep-storage=2gb -f 2>/dev/null || true

          # 8. Clean Bun .node cache files (8.8MB each, ~400/week, never auto-cleaned)
          find /tmp -maxdepth 1 -name '.ff*.node' -delete 2>/dev/null || true

          # 9. Clean other stale /tmp files (tmpfs has user quota, fills up fast)
          find /tmp -maxdepth 1 -user "$(whoami)" -mtime +1 \
            ! -name 'claude-*' \
            ! -name 'bunx-*' \
            -exec rm -rf {} + 2>/dev/null || true
          echo "=== After ==="
          docker system df
          echo "=== /tmp ==="
          du -sh /tmp/ 2>/dev/null || true

  # ── Keeps the self-hosted runner's pre-extracted Obsidian AppImage at the
  # latest released version so E2E tests exercise up-to-date Obsidian.
  # Weekly check (Obsidian ships every 2-4 weeks). `force` input re-downloads
  # even when version matches (used after install corruption).
  obsidian-update:
    if: |
      github.event.schedule == '0 4 * * 1'
      || github.event.inputs.task == 'obsidian-update'
    runs-on: [self-hosted, linux, x64, isolated]
    permissions:
      contents: read
    steps:
      # Full checkout (no sparse). Earlier versions used sparse-checkout to fetch
      # only update-obsidian.sh, but that left `core.sparseCheckout=true` and
      # skip-worktree bits on the shared self-hosted runner workspace, poisoning
      # subsequent CI jobs (mix.exs absent → "Could not find a Mix.Project").
      - uses: actions/checkout@v7

      - name: Update Obsidian to latest release
        run: |
          chmod +x .github/update-obsidian.sh
          if [ "${{ inputs.force }}" = "true" ]; then
            bash .github/update-obsidian.sh --force
          else
            bash .github/update-obsidian.sh
          fi

      - name: Show installed version
        run: |
          if [ -f "$HOME/Applications/.obsidian-version" ]; then
            echo "Installed Obsidian version: $(cat "$HOME/Applications/.obsidian-version")"
          else
            echo "No version file — install may have failed"
            exit 1
          fi

  # ── Weekly plans-triage script: digests plan files in docs/superpowers/ and
  # opens/updates a tracking issue summarizing status. Needs write perms to
  # commit + issue/PR perms for the digest output.
  plan-triage:
    if: |
      github.event.schedule == '0 14 * * 1'
      || github.event.inputs.task == 'plan-triage'
    runs-on: [self-hosted, linux, x64, isolated]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for first/last commit lookups

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet pyyaml

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Run plan triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/plan-triage.py

  # ── Surface JS deps with a newer MAJOR than the current caret-range allows.
  # `bun outdated` only walks within existing semver, so v5→v6 package renames
  # (e.g. @clerk/clerk-react → @clerk/react) stay invisible until a CVE forces
  # them. ncu --target latest + jq filter to majors, opens/updates a single
  # tracking issue. Closing the issue is the signal that the next bump should
  # happen.
  frontend-major-updates:
    if: |
      github.event.schedule == '17 13 * * 1'
      || github.event.inputs.task == 'frontend-major-updates'
    runs-on: [self-hosted, linux, x64, isolated]
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      # Pinned like the verify.yml jobs: `latest` defeats setup-bun's cache and
      # re-downloads ~35 MB every run. This job only shells out to
      # npm-check-updates, so the bun version is incidental — but a nightly
      # that silently tracks `latest` is also how a bun bump lands in CI with
      # no PR behind it.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Run npm-check-updates and filter to major bumps
        id: scan
        working-directory: frontend
        run: |
          set -uo pipefail
          # ncu has no --target major; it gives the latest of each pkg.
          # Post-filter to drop minor/patch by comparing leading version
          # segment of current (package.json caret) vs proposed range.
          raw=$(bunx npm-check-updates --target latest --jsonUpgraded 2>/dev/null || echo '{}')
          cur=$(jq -s '.[0].dependencies + .[0].devDependencies' package.json)
          majors=$(echo "$raw" | jq --argjson cur "$cur" '
            to_entries
            | map(select(
                (($cur[.key] // "") | gsub("[\\^~>=<]"; "") | split(".")[0]) !=
                (.value             | gsub("[\\^~>=<]"; "") | split(".")[0])
              ))
            | from_entries
          ')

          if [ "$majors" = '{}' ] || [ -z "$majors" ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "No major drift."
            exit 0
          fi
          echo "drift=true" >> "$GITHUB_OUTPUT"

          # Markdown table: pkg | current caret | proposed
          {
            echo "table<<EOF"
            echo "| Package | Current | Proposed major |"
            echo "|---|---|---|"
            echo "$majors" | jq -r --argjson cur "$cur" \
              'to_entries[] | "| `\(.key)` | `\($cur[.key] // "?")` | `\(.value)` |"'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Find or update tracking issue
        if: steps.scan.outputs.drift == 'true'
        uses: actions/github-script@v9
        env:
          DRIFT_TABLE: ${{ steps.scan.outputs.table }}
        with:
          script: |
            const title = 'chore(deps): frontend major-version drift'
            const body = [
              'Weekly `npm-check-updates --target major` scan in `frontend/` found packages with a newer major than the current caret-range allows.',
              '',
              process.env.DRIFT_TABLE,
              '',
              '## Why this exists',
              '',
              '`bun outdated` only walks within the existing semver caret, so a v5→v6 package rename stays invisible until a CVE forces the bump (see PR #356 / Clerk).',
              '',
              '## Action',
              '',
              'Review each entry — bumps may require code changes, migration guides, or be intentionally pinned. Close this issue once handled; the next scan opens a fresh one if drift remains.',
              '',
              `Scan: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n')

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deps,frontend',
              per_page: 100,
            })
            const match = existing.find((i) => i.title === title)

            if (match) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              })
              core.info(`Updated existing issue #${match.number}`)
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['deps', 'frontend'],
              })
              core.info(`Opened issue #${created.number}`)
            }

  # ── Read-only audit of the self-hosted runner host: surfaces the things
  # that bit the local dev box (FUSE mount_max, coredump pile-on, ABRT bloat,
  # OOM history, concurrent chromium/obsidian footprint).
  #
  # Manual trigger only — run after suspected runner instability or before
  # making host-config changes. Output goes to the workflow log; nothing
  # is modified.
  runner-diagnostics:
    if: github.event.inputs.task == 'runner-diagnostics'
    runs-on: [self-hosted, linux, x64, isolated]
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Host identity
        run: |
          echo "=== Host ==="
          hostname
          uname -a
          uptime
          echo "Runner: ${RUNNER_NAME:-unset}"

      - name: Memory + swap
        run: |
          echo "=== Memory ==="
          free -h
          echo "--- /proc/meminfo (key fields) ---"
          grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree|Committed_AS):' /proc/meminfo

      - name: Load + top RSS consumers
        run: |
          echo "=== Load average ==="
          cat /proc/loadavg
          echo "=== Top 20 by RSS ==="
          ps -eo pid,user,rss,pcpu,etime,comm --sort=-rss | head -21

      - name: Concurrent browser/runtime footprint
        run: |
          echo "=== Live obsidian/chromium/xvfb/playwright procs ==="
          ps -eo pid,rss,etime,cmd 2>/dev/null \
            | grep -iE 'obsidian|chromium|chrome|xvfb|playwright|node.*plugin' \
            | grep -v grep \
            | awk '{
                rss=$2; total+=rss;
                # Truncate cmd for readability
                cmd=""; for (i=4;i<=NF;i++) cmd=cmd" "$i;
                if (length(cmd)>140) cmd=substr(cmd,1,137)"...";
                printf "%8s  %8dK  %10s %s\n", $1, rss, $3, cmd
              }
              END { printf "TOTAL RSS across matched procs: %d MB\n", total/1024 }'

      - name: FUSE config (mount_max + current mounts)
        run: |
          echo "=== /etc/fuse.conf ==="
          cat /etc/fuse.conf 2>/dev/null || echo "(not present)"
          echo "--- Current FUSE mounts ---"
          fuse_count=$(mount -t fuse,fuse.portal,fuse.gvfsd-fuse,fuse3 2>/dev/null | wc -l)
          all_count=$(mount | wc -l)
          echo "fuse mounts: $fuse_count   total mounts: $all_count"
          echo "--- max_user_namespaces / mount limits (kernel) ---"
          sysctl -a 2>/dev/null | grep -E 'fs\.mount-max|user\.max_mnt_namespaces' || true

      - name: Coredump config + storage
        run: |
          echo "=== /etc/systemd/coredump.conf ==="
          cat /etc/systemd/coredump.conf 2>/dev/null || echo "(default)"
          for d in /etc/systemd/coredump.conf.d; do
            if [ -d "$d" ]; then
              echo "--- $d/* ---"
              for f in "$d"/*.conf; do [ -f "$f" ] && { echo "# $f"; cat "$f"; }; done
            fi
          done
          echo "--- Coredump disk usage ---"
          du -sh /var/lib/systemd/coredump 2>/dev/null || echo "(no spool dir)"
          echo "--- Coredumps in last 7d ---"
          coredumpctl list --since=-7d 2>/dev/null | tail -20 || echo "coredumpctl unavailable"

      - name: ABRT presence + config
        run: |
          echo "=== ABRT installed? ==="
          if command -v abrtd >/dev/null 2>&1 || systemctl list-unit-files 'abrt*' 2>/dev/null | grep -q abrt; then
            echo "ABRT is installed."
            systemctl list-unit-files 'abrt*' --no-pager 2>/dev/null | head -20
            for f in /etc/abrt/abrt.conf /etc/abrt/plugins/CCpp.conf; do
              [ -f "$f" ] && { echo "--- $f ---"; cat "$f"; }
            done
            echo "--- ABRT spool size ---"
            du -sh /var/spool/abrt /var/tmp/abrt 2>/dev/null || true
          else
            echo "ABRT not installed — good (no pile-on risk)."
          fi

      - name: OOM history (this boot + previous)
        run: |
          echo "=== Boots ==="
          journalctl --list-boots --no-pager 2>/dev/null | tail -5 || true
          echo "=== OOM events, last 7d ==="
          journalctl --no-pager --since=-7d 2>/dev/null \
            | grep -E 'invoked oom-killer|Out of memory: Killed|oom_reaper' \
            | tail -30 \
            || echo "No OOM events in last 7d."

      - name: User systemd services on runner host
        run: |
          echo "=== --user services (running) ==="
          systemctl --user list-units --type=service --state=running --no-pager 2>/dev/null \
            | head -40 \
            || echo "(no --user manager for this UID — runner likely runs as system service)"
          echo "=== --user units with Restart= (risk of crash-loop) ==="
          for unit in $(systemctl --user list-unit-files --type=service --no-legend 2>/dev/null | awk '{print $1}'); do
            r=$(systemctl --user show "$unit" -p Restart --value 2>/dev/null || echo "")
            if [ -n "$r" ] && [ "$r" != "no" ]; then
              rs=$(systemctl --user show "$unit" -p RestartSec --value 2>/dev/null || echo "?")
              slb=$(systemctl --user show "$unit" -p StartLimitBurst --value 2>/dev/null || echo "?")
              sli=$(systemctl --user show "$unit" -p StartLimitIntervalUSec --value 2>/dev/null || echo "?")
              printf "  %s  Restart=%s RestartSec=%s StartLimitBurst=%s StartLimitInterval=%s\n" \
                "$unit" "$r" "$rs" "$slb" "$sli"
            fi
          done

      - name: Disk + tmp usage
        run: |
          echo "=== Filesystems ==="
          df -h -x tmpfs -x devtmpfs 2>/dev/null | head -15
          echo "=== /tmp size + Bun .ff*.node count ==="
          du -sh /tmp 2>/dev/null || true
          find /tmp -maxdepth 1 -name '.ff*.node' 2>/dev/null | wc -l | xargs printf "  .ff*.node files: %s\n"
          echo "=== Docker disk ==="
          docker system df 2>/dev/null || echo "(docker not reachable)"

      - name: Obsidian install state
        run: |
          echo "=== ~/Applications ==="
          ls -la "$HOME/Applications" 2>/dev/null | grep -iE 'obsidian|extracted' || echo "(no Obsidian artifacts)"
          if [ -f "$HOME/Applications/.obsidian-version" ]; then
            echo "Installed Obsidian: $(cat "$HOME/Applications/.obsidian-version")"
          fi
          echo "--- Stray AppImage FUSE mount-points (should be 0 between jobs) ---"
          mount | grep -i obsidian || echo "  none"

      - name: Runner agents on this host
        run: |
          echo "=== Active runner processes ==="
          pgrep -af 'Runner.Listener|Runner.Worker' 2>/dev/null || echo "(none — this output should never print, runner is executing this!)"
          echo "=== Runner work dirs ==="
          ls -ld "$HOME"/actions-runner* 2>/dev/null || echo "(no actions-runner* dirs in HOME)"

  # ── Weekly Hex SBOM refresh. The push-on-main path lives in verify.yml
  # (submit-dep-graph job) and fires when mix.exs / mix.lock changes;
  # this cron path catches transitive bumps from Hex retire/replace
  # events that happen outside our own commits. Saturday 03:00 UTC.
  # See pre-fold dependency-submission.yml for the historical why
  # (GitHub's static mix.lock parser silently fails on this repo).
  dependency-submission:
    if: |
      github.event.schedule == '0 3 * * 6'
      || github.event.inputs.task == 'dependency-submission'
    runs-on: [self-hosted, linux, x64, isolated]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Fetch deps
        # Separate from the action's own `install-deps: true` so transient
        # hex.pm timeouts are easier to diagnose.
        run: mix deps.get

      - name: Submit Hex SBOM to GitHub
        uses: erlef/mix-dependency-submission@v1
        with:
          install-deps: true

  # ── MCP OAuth conformance against a DEPLOYED authorization server.
  #
  # COMPLEMENTS the per-PR gate rather than substituting for it. test_88 gates
  # every PR on the `spec` stage against a CI stack; this runs the `oauth`
  # stage, which CANNOT run there: MCPJam's SDK refuses outbound OAuth fetches
  # to RFC 6890 special-use addresses and the CLI exposes no opt-in, so the
  # matrix needs a publicly-addressed deployment. See
  # docs/context/mcp-conformance-suite-limits.md.
  #
  # `protocol` is deliberately absent: it is genuinely red (#1259 — ping
  # unimplemented, no Host-rebinding rejection, we announce protocol
  # 2025-03-26). Including it would page nightly for a known, filed issue.
  # Add it to CONFORMANCE_STAGES when #1259 closes.
  #
  # Non-gating on purpose: it grades a deployment rather than a commit, so a red
  # run means "staging is wrong" — a page, not a merge block. The page is the
  # last step in this job; a failing cron nobody subscribes to is not one.
  mcp-conformance:
    if: |
      github.event.schedule == '40 5 * * *'
      || github.event.inputs.task == 'mcp-conformance'
    name: mcp-conformance (${{ matrix.label }})
    runs-on: [self-hosted, linux, x64, isolated, light]
    # 8 CLI runs (2 strategies x 4 protocol versions) plus the spec assertions.
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write   # regressions open/update a tracking issue (see last step)
    strategy:
      # Independent deployments — one being red says nothing about the other,
      # and finding out about both in one run is the point.
      fail-fast: false
      matrix:
        include:
          # Staging carries the full matrix: the OAuth stage performs real DCR
          # and CIMD registrations, which write client rows, so it belongs on a
          # deployment we are happy to dirty.
          - label: staging
            target: https://staging.engram.page/api/mcp
            stages: spec,oauth

          # Prod runs the spec stage ONLY — it is plain unauthenticated curl, so
          # it writes nothing. Not thoroughness-limited by accident: the OAuth
          # matrix would register throwaway clients in the production database
          # every night.
          #
          # Prod is not redundant with staging, it is the only coverage that
          # exists for a whole branch of the code. `ENGRAM_HOST_REWRITE_ENABLED`
          # is prod-only, so `mcp_rewrite_host?/1` is FALSE everywhere else and
          # the bare-root `resource`, its `resource_metadata_url`, and the
          # MCP-host `/oauth` passthrough are unexercised by staging, by the CI
          # stack, and by the unit suite. Dial the BARE host, because that is
          # what the docs tell users to paste and what that branch produces.
          - label: prod
            target: https://mcp.engram.page
            stages: spec
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the drift calculation below needs the deployed sha to
          # exist locally and needs origin/main's ancestry. The default shallow
          # clone silently yields "?" for every run.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Which BUILD is under test. Without this a red run is ambiguous: a stale
      # deployment and a real regression look identical, and the first instinct
      # is to go hunting through OAuth code. Observed 2026-08-05 — staging sat
      # 3 commits behind because an engram-infra bump PR was green but never
      # auto-merged, so the spec assertions failed for a deploy-valve reason.
      - name: Identify the deployed build
        id: deployed
        shell: bash
        env:
          TARGET: ${{ github.event.inputs.target-url || matrix.target }}
        run: |
          origin="${TARGET%/api/mcp}"
          sha=$(curl -fsS --max-time 15 "$origin/api/health" \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin).get("build_sha","unknown"))' \
                  || echo "unreachable")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$sha" = "unknown" ] || [ "$sha" = "unreachable" ]; then
            echo "deployed build: $sha (drift unknown)"
            echo "drift=unknown" >> "$GITHUB_OUTPUT"
          else
            behind=$(git rev-list --count "$sha..origin/main" 2>/dev/null || echo "?")
            echo "deployed build: $sha ($behind commits behind main)"
            echo "drift=$behind" >> "$GITHUB_OUTPUT"
          fi

      - name: OAuth conformance (DCR + CIMD matrix)
        id: conformance
        shell: bash
        # `set -o pipefail` is load-bearing. GitHub's default shell is `bash -e`
        # WITHOUT pipefail, so `script | tee` would report tee's exit code and
        # every regression would land as a green run.
        #
        # The target goes in `env:` rather than being interpolated into the
        # script body — `target-url` is a workflow_dispatch input, and `${{ }}`
        # inside `run:` is textual substitution.
        env:
          TARGET: ${{ github.event.inputs.target-url || matrix.target }}
          CONFORMANCE_STAGES: ${{ matrix.stages }}
        run: |
          set -o pipefail
          mkdir -p conformance-results
          rc=0
          ./scripts/mcp-conformance.sh "$TARGET" 2>&1 \
            | tee conformance-results/run.log || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Per-target name: upload-artifact@v4+ ERRORS on a duplicate name
          # rather than merging, so a bare `mcp-conformance-results` would make
          # whichever matrix leg finished second fail on the upload — losing the
          # evidence for the leg that may be the one that failed.
          name: mcp-conformance-results-${{ matrix.label }}
          path: conformance-results/
          retention-days: 14

      # Gated on rc == 1 specifically: the script exits 2 when npm or the target
      # is unreachable, which is infrastructure, not a conformance result. Those
      # still fail the run; they just do not open "the auth server is broken"
      # and send someone reading OAuth code over a DNS blip.
      - name: Open or update the regression issue
        if: failure() && steps.conformance.outputs.rc == '1'
        uses: actions/github-script@v9
        env:
          TARGET: ${{ github.event.inputs.target-url || matrix.target }}
          DEPLOYED_SHA: ${{ steps.deployed.outputs.sha }}
          DEPLOYED_DRIFT: ${{ steps.deployed.outputs.drift }}
        with:
          script: |
            const fs = require('fs')
            const target = process.env.TARGET
            const host = new URL(target).host
            const sha = process.env.DEPLOYED_SHA
            const drift = process.env.DEPLOYED_DRIFT
            const title = `ops(mcp): OAuth conformance regression on ${host}`

            let log = '(no output captured)'
            try {
              log = fs.readFileSync('conformance-results/run.log', 'utf8').slice(-4000)
            } catch (e) {
              core.warning(`could not read run.log: ${e.message}`)
            }

            const staleness = drift === 'unknown'
              ? 'Could not determine which build is deployed.'
              : Number(drift) > 0
                ? `**The deployed build is ${drift} commit(s) behind main.** Check that before reading this as a regression — a stale deployment fails these assertions for a deploy-pipeline reason, not an OAuth one.`
                : 'The deployed build is level with main, so this is not deploy lag.'

            const body = [
              `The nightly MCP OAuth conformance run failed against \`${target}\`.`,
              '',
              `Deployed build: \`${sha}\``,
              '',
              staleness,
              '',
              'This runs MCPJam\'s CLI — a real third-party client — through both the DCR',
              'and CIMD registration paths across every protocol version. It grades a',
              '**deployment**, not a commit, and covers the one stage the per-PR gate',
              'cannot: MCPJam refuses loopback targets, so the OAuth matrix can only run',
              'against a publicly-addressed host.',
              '',
              '## Output',
              '',
              '```',
              log.trimEnd(),
              '```',
              '',
              '## Where to start',
              '',
              '- `docs/context/mcp-conformance-suite-limits.md` — what each stage can and cannot prove.',
              '- `docs/context/cimd-vs-dcr-validation-policy.md` — why DCR and CIMD validate differently.',
              '- Step-by-step JSON is in the `mcp-conformance-results` artifact.',
              '- `NO SIGNAL` (rather than `REGRESSION`) means the CLI output shape changed and the',
              '  suite graded nothing — fix the harness first; the server may be fine.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n')

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'mcp', per_page: 100,
            })
            const match = existing.find((i) => i.title === title)

            if (match) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, body,
              })
              core.info(`Updated existing issue #${match.number}`)
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['mcp', 'area/auth'],
              })
              core.info(`Opened issue #${created.number}`)
            }

      # Discord alert. The tracking issue above is the durable record; this is
      # the push notification, because a prod OAuth regression is silent from
      # the outside — every existing client keeps working on its issued token
      # and only NEW connections fail, so nothing else surfaces it.
      #
      # Guarded on the secret being present so this is a no-op until the webhook
      # consolidation lands (one `announce` + one `alert` channel, replacing the
      # per-repo DISCORD_RELEASES_/DISCORD_DEPLOY_ sprawl). Same
      # `env.WEBHOOK != ''` idiom deploy-prod.yml already uses.
      #
      # Fires for BOTH targets: staging red blocks the next release, prod red is
      # user-facing. The host is in the message so severity is obvious at a
      # glance rather than encoded in which channel it lands in.
      - name: Alert Discord (conformance regression)
        if: failure() && steps.conformance.outputs.rc == '1' && env.WEBHOOK != ''
        env:
          WEBHOOK: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          TARGET: ${{ github.event.inputs.target-url || matrix.target }}
          LABEL: ${{ matrix.label }}
          DEPLOYED_SHA: ${{ steps.deployed.outputs.sha }}
          DEPLOYED_DRIFT: ${{ steps.deployed.outputs.drift }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Deploy lag is the most common false alarm here — a stale deployment
          # fails these assertions for a pipeline reason, not an OAuth one. Say
          # so in the alert instead of making the reader go look.
          case "${DEPLOYED_DRIFT}" in
            0)       DRIFT_NOTE="deployed build is level with main" ;;
            unknown) DRIFT_NOTE="could not determine the deployed build" ;;
            *)       DRIFT_NOTE="deployed build is ${DEPLOYED_DRIFT} commit(s) BEHIND main — check deploy lag before reading this as a regression" ;;
          esac

          CONTENT="[MCP-CONFORMANCE] \`${LABEL}\` — OAuth conformance FAILED against ${TARGET}
          Build: \`${DEPLOYED_SHA}\` (${DRIFT_NOTE})
          A tracking issue has been opened or updated.
          Run: ${RUN_URL}"

          curl -sS -X POST -H 'Content-Type: application/json' \
            --max-time 5 \
            --data "$(jq -nc --arg c "$CONTENT" '{content:$c}')" \
            "$WEBHOOK"

  # Scheduled work fails silently by construction: nobody opens a cron run
  # that nobody triggered. These jobs reap orphaned Clerk users and Qdrant
  # collections, keep runner disks from filling, and check MCP conformance —
  # all things that stay broken for weeks unless something says so.
  #
  # One aggregate rather than a step per job: `needs` every job, fire once if
  # any of them failed, and name the failures in the message. A given cron
  # expression only runs a subset (the rest skip), and `contains` ignores
  # skipped, so this stays quiet unless something genuinely broke.
  alert-cron-failure:
    if: always() && contains(needs.*.result, 'failure')
    needs:
      - e2e-orphans
      - runner-cleanup
      - obsidian-update
      - plan-triage
      - frontend-major-updates
      - runner-diagnostics
      - dependency-submission
      - mcp-conformance
    runs-on: [self-hosted, linux, x64, isolated, light]
    steps:
      - name: Notify cron failure (alerts)
        env:
          WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -uo pipefail
          [ -n "$WEBHOOK" ] || { echo "No alerts webhook configured — skipping."; exit 0; }
          # Name the jobs that actually failed; a bare "cron failed" would
          # send you to the run page to find out which of eight it was.
          FAILED=$(printf '%s' "$RESULTS" | jq -r 'to_entries|map(select(.value.result=="failure"))|map(.key)|join(", ")')
          CONTENT="**CRON FAILED** \`${GITHUB_REPOSITORY}\`
          Jobs: ${FAILED:-unknown}
          ${RUN_URL}"
          # flags:4 = SUPPRESS_EMBEDS. Discord auto-embeds every URL, so messages
          # rendered as a stack of preview cards. Links stay clickable without them.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: engram-ci/1.0 (+https://github.com/engram-app/Engram)' \
            --max-time 10 \
            --data "$(jq -nc --arg c "$CONTENT" --arg u 'Engram CI' '{content:$c,username:$u,flags:4}')" \
            "$WEBHOOK") || code="000"
          case "$code" in 2*) echo "Alert sent ($code)";; *) echo "::warning::Discord alert failed (HTTP $code)";; esac
