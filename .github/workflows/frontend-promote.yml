# Rollback procedure: wrangler versions deploy <previous-version-id>@100% --yes
# (No rebuild required — instant rollback by shifting traffic back to a prior version.)

name: Frontend Promote

on:
  # Fired by engram-infra's prod `terraform (prod)` apply AFTER the backend ECS
  # rollout proves healthy — preserves backend-before-frontend ordering.
  repository_dispatch:
    types: [frontend-promote]
  # Manual recovery / re-promote. Use when a dispatched promote failed, or to
  # promote a specific release commit whose worker aged out of Cloudflare's
  # retained versions (the self-heal fallback below rebuilds it).
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-char release commit SHA to promote"
        required: true
      release_tag:
        description: "release-v* tag (for the Discord announce; optional)"
        required: false

permissions:
  contents: read

concurrency:
  group: frontend-promote-prod
  cancel-in-progress: false

env:
  # Resolve the target from whichever event fired.
  SHA: ${{ github.event.client_payload.sha || github.event.inputs.sha }}
  RELEASE_TAG: ${{ github.event.client_payload.release_tag || github.event.inputs.release_tag }}
  NOTES: ${{ github.event.client_payload.notes }}

jobs:
  promote:
    runs-on: [self-hosted, linux, x64, isolated]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      # Kept in lockstep with deploy-frontend in verify.yml — this workflow's
      # self-heal fallback rebuilds the same artifact, and the two builds are
      # meant to be byte-identical. Bump both together or they are not.
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }

      - name: Resolve uploaded version for this commit (fast path)
        id: v
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SHORT=${SHA::7}
          # A sibling deploy-frontend (verify.yml) uploads a zero-traffic
          # version tagged sha-<7> on every green main push. Normally it's
          # still in Cloudflare's retained versions and we just promote it.
          VID=$(bunx wrangler versions list --json | jq -r \
            --arg t "sha-$SHORT" '[.[] | select(.annotations["workers/tag"]==$t)][0].id')
          if [ -z "$VID" ] || [ "$VID" = "null" ]; then
            # Aged out (deploy lagged the upload — e.g. a delayed release) or
            # never uploaded. The fallback rebuilds this exact commit + uploads.
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No retained frontend version for sha-$SHORT — rebuilding from the release commit."
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "vid=$VID" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild + upload this commit's frontend (self-heal fallback)
        id: rebuild
        if: steps.v.outputs.found == 'false'
        working-directory: frontend
        env:
          # Byte-identical to deploy-frontend: non-secret VITE_* come from the
          # committed frontend/.env.production; only these two are injected.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY_PROD }}
          VITE_GIT_SHA: ${{ env.SHA }}
          # Must match deploy-frontend exactly or this "byte-identical" rebuild
          # would silently produce a bundle with crash reporting switched off.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_FRONTEND }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SHORT=${SHA::7}
          bun install --frozen-lockfile
          bun run build:saas
          bunx wrangler versions upload --tag "sha-$SHORT"
          # Re-resolve the id from the API rather than scraping upload stdout.
          VID=$(bunx wrangler versions list --json | jq -r \
            --arg t "sha-$SHORT" '[.[] | select(.annotations["workers/tag"]==$t)][0].id')
          if [ -z "$VID" ] || [ "$VID" = "null" ]; then
            echo "::error::Rebuilt + uploaded sha-$SHORT but could not resolve its version id."; exit 1
          fi
          echo "vid=$VID" >> "$GITHUB_OUTPUT"

      - name: Promote to 100% production
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Whichever path produced the id (fast path or self-heal fallback).
          VID: ${{ steps.v.outputs.vid || steps.rebuild.outputs.vid }}
        run: bunx wrangler versions deploy "${VID}@100%" --yes

      # A shipped release is the ONE thing that belongs in announcements.
      # Everything else this workflow can say is a failure, and failures go
      # to alerts (below) — the two used to share one webhook, so "we
      # shipped" and "the deploy broke" landed in the same channel.
      - name: Announce release (announcements)
        env:
          WEBHOOK: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK_URL }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -uo pipefail
          [ -n "$WEBHOOK" ] || { echo "No announcements webhook configured — skipping."; exit 0; }
          # Refuse to announce a release we cannot name. The dispatcher used
          # to send the literal string "unknown" when its tag lookup failed,
          # which produced a stream of "Engram Cloud unknown is live" posts
          # linking to /releases/tag/unknown — a 404. The promote itself is
          # unaffected; it already happened in the step above. An announcement
          # nobody can act on is worse than silence.
          case "${TAG:-}" in
            ""|unknown)
              echo "::warning::No resolvable release tag (got '${TAG:-}') — promoted, but not announcing."
              exit 0
              ;;
          esac
          RELEASE_URL="https://github.com/engram-app/Engram/releases/tag/$TAG"
          # Was `${NOTES:0:1600}` — a raw byte prefix. Our release body
          # OPENS with the SCHEMA-IMPACT block, so that window was spent
          # entirely on self-host upgrade steps and the actual changes never
          # made it into Discord. The formatter selects by section + scope
          # and owns the 2000-char cap; see scripts/discord_release_notes.sh.
          # This job checks out `ref: env.SHA` — the commit being deployed —
          # so on a re-run of a release older than this script the file is
          # simply absent. Fall back to a bare announcement rather than
          # posting an empty message (which Discord 400s) or failing the
          # step, since failing here would raise a false PROMOTE FAILED
          # alert for a promote that actually succeeded.
          CONTENT=""
          if [ -f scripts/discord_release_notes.sh ]; then
            CONTENT=$(printf '%s' "$NOTES" | bash scripts/discord_release_notes.sh \
              "Engram Cloud" "$TAG" "$RELEASE_URL") || CONTENT=""
          fi
          [ -n "$CONTENT" ] || CONTENT=$(printf '**Engram Cloud %s** is live\n%s' "$TAG" "$RELEASE_URL")
          # flags:4 = SUPPRESS_EMBEDS. Discord auto-embeds every URL, so messages
          # rendered as a stack of preview cards. Links stay clickable without them.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: engram-ci/1.0 (+https://github.com/engram-app/Engram)' \
            --max-time 10 \
            --data "$(jq -nc --arg c "$CONTENT" --arg u 'Engram Releases' '{content:$c,username:$u,flags:4}')" \
            "$WEBHOOK") || code="000"
          case "$code" in 2*) echo "Announced ($code)";; *) echo "::warning::Discord announce failed (HTTP $code)";; esac

      - name: Notify promote failure (alerts)
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK_URL }}
          TAG: ${{ env.RELEASE_TAG }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          [ -n "$WEBHOOK" ] || { echo "No alerts webhook configured — skipping."; exit 0; }
          CONTENT=$(printf '**PROMOTE FAILED** `%s`\nThe release built but the frontend did not go to 100%%.\n%s' "$TAG" "$RUN_URL")
          # flags:4 = SUPPRESS_EMBEDS. Discord auto-embeds every URL, so messages
          # rendered as a stack of preview cards. Links stay clickable without them.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: engram-ci/1.0 (+https://github.com/engram-app/Engram)' \
            --max-time 10 \
            --data "$(jq -nc --arg c "$CONTENT" --arg u 'Engram CI' '{content:$c,username:$u,flags:4}')" \
            "$WEBHOOK") || code="000"
          case "$code" in 2*) echo "Alert sent ($code)";; *) echo "::warning::Discord alert failed (HTTP $code)";; esac
