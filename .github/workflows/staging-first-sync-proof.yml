name: staging-first-sync-proof
run-name: staging-first-sync-proof ${{ inputs.run_id }}

# Load half of e2e/load/first_sync_proof.py: one real plugin engine runs a
# 30k-note + attachments first sync into a fresh staging vault. Manual only.
# Do not dispatch this by hand: `first_sync_proof.py watch --dispatch` (dev box,
# needs SSH to FastRaid) starts it, grants the account's limits, kills the
# staging container mid-sync and writes the summary. The runner VM has no SSH
# key for FastRaid by design, which is why the two halves are split.
#
# Needs the STAGING_CLERK_SECRET_KEY secret, as staging-load.yml does.
# Footprint on the runner VM (8 vCPU / 16 GB): ~1 GB of corpus on disk, one bun
# process (estimate 1.5-3 GB RSS, 1-2 cores) for the length of the sync.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id from the watcher (names the vault)
        type: string
        required: true
      api:
        type: string
        default: http://10.0.20.214:8000/api
      notes:
        type: string
        default: "30000"
      attachments:
        type: string
        default: "2000"
      seed:
        type: string
        default: "2306"
      plugin_ref:
        description: Engram-obsidian ref for the plugin engine
        type: string
        default: main

concurrency:
  group: staging-first-sync-proof
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    runs-on: [self-hosted, linux, x64, isolated]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      # Inputs reach the shell through env: and are validated, never pasted
      # into `run:` (this step's job holds the Clerk secret).
      - name: Validate inputs
        env:
          RUN_ID: ${{ inputs.run_id }}
          API: ${{ inputs.api }}
          NOTES: ${{ inputs.notes }}
          ATTACHMENTS: ${{ inputs.attachments }}
          SEED: ${{ inputs.seed }}
          PLUGIN_REF: ${{ inputs.plugin_ref }}
        run: |
          [[ "$RUN_ID" =~ ^[A-Za-z0-9]{6,40}$ ]] || { echo "::error::bad run_id"; exit 1; }
          for v in NOTES ATTACHMENTS SEED; do
            [[ "${!v}" =~ ^[0-9]{1,6}$ ]] || { echo "::error::$v must be an integer"; exit 1; }
          done
          [[ "$PLUGIN_REF" =~ ^[A-Za-z0-9._/-]{1,100}$ ]] || { echo "::error::bad plugin_ref"; exit 1; }
          [[ "$API" =~ ^https?://[A-Za-z0-9.:-]+(/[A-Za-z0-9._/-]*)?$ ]] || { echo "::error::bad api URL"; exit 1; }
          # first_sync_proof.py also refuses any host outside the staging allowlist.

      - name: Checkout plugin
        env:
          PLUGIN_REF: ${{ inputs.plugin_ref }}
        run: |
          rm -rf plugin-src
          git clone --depth=1 --branch "$PLUGIN_REF" https://github.com/engram-app/Engram-obsidian.git plugin-src

      - name: Install deps
        env:
          BUN_VERSION: "1.3.11"
        run: |
          if [ "$("$HOME/.bun/bin/bun" --version 2>/dev/null)" != "$BUN_VERSION" ]; then
            curl -fsSL https://bun.sh/install | bash -s "bun-v$BUN_VERSION"
          fi
          export PATH="$HOME/.bun/bin:$PATH"
          (cd plugin-src && bun install --frozen-lockfile --registry http://10.0.20.214:4873)
          python3 -m venv .venv-load
          .venv-load/bin/pip install -q 'requests>=2.33' 'websockets>=13' urllib3

      - name: First sync
        env:
          STAGING_CLERK_SECRET_KEY: ${{ secrets.STAGING_CLERK_SECRET_KEY }}
          ENGRAM_PLUGIN_SRC: ${{ github.workspace }}/plugin-src
          RUN_ID: ${{ inputs.run_id }}
          API: ${{ inputs.api }}
          NOTES: ${{ inputs.notes }}
          ATTACHMENTS: ${{ inputs.attachments }}
          SEED: ${{ inputs.seed }}
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          .venv-load/bin/python e2e/load/first_sync_proof.py load --api "$API" \
            --run-id "$RUN_ID" --notes "$NOTES" --attachments "$ATTACHMENTS" --seed "$SEED" \
            --work "$RUNNER_TEMP/fsproof-work" --out fsproof-out

      - name: Drop the corpus
        if: always()
        run: rm -rf "$RUNNER_TEMP/fsproof-work"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: first-sync-proof-${{ inputs.run_id }}
          path: fsproof-out/
          retention-days: 30
